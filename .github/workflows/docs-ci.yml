name: 'Docs: Build and Publish (Sphinx)'

on:
  push:
    branches: [ "**" ]
    paths:
      - '.github/workflows/docs-ci.yml'
      - 'sphinx/**'
      - 'src/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/docs-ci.yml'
      - 'sphinx/**'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Sphinx documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install project docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx myst-parser furo

      - name: Build Sphinx site
        env:
          PYTHONPATH: src/python
        run: |
          sphinx-build -M html sphinx sphinx/_build



      - name: Publish Sphinx to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: sphinx/_build
